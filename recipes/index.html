<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>Recipe Book</title>
  <meta name="description"
    content="A Website to store and share recipes. Each recipe has a name, image, rating, and instructions." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />

  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Recipe Book</title>
  <meta name="description"
    content="A Website to store and share recipes. Each recipe has a name, image, rating, and instructions.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Recipe Book">
  <meta property="og:description" content="A Website to store and share recipes.">
  <meta property="og:url" content="https://joshua-baird.github.io/wdd131/recipes/index.html">
  <meta property="og:image" content="./images/social-media.jpg">

  <!-- X Card -->
  <meta name="twitter:card" content="Social Preview Image">
  <meta name="twitter:title" content="Recipe Book">
  <meta name="twitter:description" content="A Website to store and share recipes.">
  <meta name="twitter:image" content="./images/social-media.jpg">

  <!-- One favicon (ICO works everywhere) -->
  <link rel="icon" href="/favicon.ico">

  <!-- One Apple Touch Icon (iOS home screen) -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="apple-touch-icon" href="somedir/apple-touch-icon-iphone-60x60.png">
  <link rel="apple-touch-icon" sizes="60x60" href="somedir/apple-touch-icon-ipad-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="somedir/apple-touch-icon-iphone-retina-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="somedir/apple-touch-icon-ipad-retina-152x152.png">


</head>

<body>
  <header>
  </header>
  <main>
    <div class="header-content">
      <img src="images/recipe-book-icon.png" alt="recipe book icon" id="recipe-book-icon">
      <h1>Recipe Book</h1>
    </div>
    <div class="search-container">
      <input type="text" placeholder="Find a recipe" class="search-input">
      <button type="submit" class="search-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
    <div class="recipe-container">
      <section class="recipe">
        <img src="images/apple-crisp.jpg" alt="Apple Crisp" class="recipe-image">
        <div class="recipe-content">
          <button class="type-button">Dessert</button>
          <h2>Apple Crisp</h2>
          <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>
          <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm
            with a scoop of vanilla ice cream.</p>
        </div>
      </section>
    </div>
  </main>
</body>
<footer>

    <a href="#"><img src="images/youtube-icon.svg" alt="youtube icon"></a>
    <a href="#"><img src="images/pinterest-icon.svg" alt="pinterest icon"></a>
  </div>

</footer>

</html>
